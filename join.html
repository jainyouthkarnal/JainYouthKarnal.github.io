<section id="join" class="section section-light"><div class="container join-grid"><div><p class="eyebrow" data-i18n="join.eyebrow">BECOME A PART</p><h2 data-i18n="join.title">Join Jain Youth Karnal.</h2><p class="copy" data-i18n="join.text">Whether you want to join a yatra, volunteer at an event, contribute content, participate in seva or simply stay connected — we'd love to hear from you.</p></div><form class="join-form" action="mailto:jainyouthkarnal@gmail.com" method="post" enctype="text/plain"><label><span data-i18n="form.name">Name</span><input name="name" required placeholder="Your name" data-i18n-placeholder="form.nameph"></label><label><span data-i18n="form.email">Email</span><input type="email" name="email" placeholder="Your email" data-i18n-placeholder="form.emailph"></label><label><span data-i18n="form.phone">Phone</span><input name="phone" placeholder="Your phone number" data-i18n-placeholder="form.phoneph"></label><label><span data-i18n="form.interest">How would you like to participate?</span><select name="interest"><option data-i18n="form.opt1">Jain Yatra</option><option data-i18n="form.opt2">Events</option><option data-i18n="form.opt3">Seva</option><option data-i18n="form.opt4">Jain Education</option><option data-i18n="form.opt5">Bhakti</option><option data-i18n="form.opt6">Content / Photography</option><option data-i18n="form.opt7">Volunteering</option></select></label><button class="button primary" type="submit" data-i18n="form.submit">Connect With Us</button></form></div></section>
