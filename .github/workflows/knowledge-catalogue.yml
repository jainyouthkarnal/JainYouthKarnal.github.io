name: Update Knowledge Catalogue
on:
  push:
    branches: [main, master]
    paths:
      - 'knowledge/**'
      - 'arghya.html'
      - 'scripts/build_knowledge_index.py'
      - 'data/knowledge-index.json'
      - '.github/workflows/knowledge-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build knowledge catalogue
        run: python scripts/build_knowledge_index.py
      - name: Commit catalogue if changed
        run: |
          if git diff --quiet -- data/knowledge-index.json; then
            echo 'Knowledge catalogue is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/knowledge-index.json
          git commit -m 'chore: update knowledge catalogue'
          git push
