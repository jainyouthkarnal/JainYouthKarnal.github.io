<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Read Jain bhajan and aarti lyrics in Hindi and English transliteration, aligned verse by verse.">
<meta name="theme-color" content="#148A45">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-icon.png">
<title>Bhajan Lyrics | Jain Youth Karnal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
<style>
.lyrics-language-cards {
  display: grid;
  gap: 20px;
  margin-top: 24px;
}
.lyrics-language-cards[data-view="both"] {
  grid-template-columns: 1fr 1fr;
}
.lyrics-language-cards[data-view="hindi"] {
  grid-template-columns: 1fr;
}
.lyrics-language-cards[data-view="hindi"] .language-card-english {
  display: none !important;
}
.lyrics-language-cards[data-view="roman"] {
  grid-template-columns: 1fr;
}
.lyrics-language-cards[data-view="roman"] .language-card-hindi {
  display: none !important;
}
.lyrics-language-card {
  background: #fffdfb;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: clamp(20px, 3vw, 32px);
  box-shadow: 0 8px 24px rgba(12,59,46,.05);
}
.lyrics-language-stanza {
  margin-bottom: 20px;
  line-height: 2;
  font-size: 1.05rem;
}
.language-card-hindi .lyrics-language-stanza {
  font-family: 'Noto Sans Devanagari', sans-serif;
  color: #211f1d;
}
.language-card-english .lyrics-language-stanza {
  font-family: 'DM Sans', sans-serif;
  color: #5c4a30;
}
@media (max-width: 768px) {
  .lyrics-language-cards[data-view="both"] {
    grid-template-columns: 1fr;
  }
}
</style>

<body class="page-bhakti page-lyrics">
<div class="scroll-progress" aria-hidden="true"></div>
<div class="jain-flag-bar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<div id="site-header"></div>
<script src="layout.js"></script>

<main id="main">
  <section class="section section-bhakti lyrics-page-section">
    <div class="container">
      <a class="lyrics-back" href="bhakti.html">← Back to Bhakti Sangeet</a>
      <div class="lyrics-page-heading">
        <p class="eyebrow">BHAKTI SANGEET</p>
        <h1 id="lyrics-title">Loading lyrics…</h1>
        <p id="lyrics-subtitle">Devotional verses</p>
      </div>

      <!-- Controls matching the shared pill style -->
      <div class="bhajan-view-controls lyrics-page-controls" role="group" aria-label="Choose lyrics language">
        <button class="bhajan-view-btn" data-view="hindi" type="button" aria-pressed="false">हिंदी</button>
        <button class="bhajan-view-btn" data-view="roman" type="button" aria-pressed="false">English</button>
        <button class="bhajan-view-btn active" data-view="both" type="button" aria-pressed="true">Both</button>
      </div>

      <div id="lyrics-content" class="lyrics-language-cards" aria-live="polite">
        <p>Loading the full lyrics…</p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const id = Number(params.get('id'));
  const title = document.getElementById('lyrics-title');
  const subtitle = document.getElementById('lyrics-subtitle');
  const content = document.getElementById('lyrics-content');

  try {
    if (!Number.isInteger(id) || id < 1) throw new Error('Missing bhajan selection');
    const res = await fetch('bhakti.html');
    if (!res.ok) throw new Error('Could not load the bhajan library');
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const cards = [...doc.querySelectorAll('.bhajan-card')];
    const card = cards[id - 1];
    if (!card) throw new Error('This bhajan could not be found');

    const hiTitle = card.querySelector('.bhajan-title-hi')?.textContent?.trim() || card.querySelector('.bhajan-head h3')?.textContent?.trim() || '';
    const enTitle = card.querySelector('.bhajan-title-en')?.textContent?.trim() || card.querySelector('.bhajan-subhead')?.textContent?.trim() || '';

    const hi = [...(card.querySelector('.lyrics-hi')?.querySelectorAll('p') || [])];
    const en = [...(card.querySelector('.lyrics-roman')?.querySelectorAll('p') || [])];
    if (!hi.length && !en.length) throw new Error('Lyrics are not available for this selection yet');

    content.innerHTML = '';

    // Generates the language card without any H3 heading labels
    const makeLanguageCard = (language, items) => {
      const cardEl = document.createElement('section');
      cardEl.className = 'lyrics-language-card ' + (language === 'hindi' ? 'language-card-hindi' : 'language-card-english');
      cardEl.dataset.language = language;
      const body = document.createElement('div');
      body.className = 'lyrics-language-card-body';
      body.lang = language === 'hindi' ? 'hi' : 'en';

      if (items.length) {
        items.forEach((item, index) => {
          const stanza = document.createElement('div');
          stanza.className = 'lyrics-language-stanza';
          stanza.setAttribute('aria-label', 'Verse ' + (index + 1));
          stanza.innerHTML = item.innerHTML;
          body.append(stanza);
        });
      } else {
        body.innerHTML = '<p class="translation-missing">Lyrics are not available in this language yet.</p>';
      }

      cardEl.append(body);
      return cardEl;
    };

    content.append(
      makeLanguageCard('hindi', hi),
      makeLanguageCard('roman', en)
    );

    const controls = [...document.querySelectorAll('.lyrics-page-controls [data-view]')];

    // Updates both lyrics columns and top heading dynamically
    function setView(mode) {
      const safeMode = ['hindi', 'roman', 'both'].includes(mode) ? mode : 'both';
      content.dataset.view = safeMode;

      if (safeMode === 'hindi') {
        title.textContent = hiTitle || enTitle;
        subtitle.hidden = true;
      } else if (safeMode === 'roman') {
        title.textContent = enTitle || hiTitle;
        subtitle.hidden = true;
      } else {
        title.textContent = hiTitle;
        if (enTitle) {
          subtitle.textContent = enTitle;
          subtitle.hidden = false;
        } else {
          subtitle.hidden = true;
        }
      }

      document.title = (title.textContent || 'Bhajan Lyrics') + ' | Jain Youth Karnal';

      controls.forEach(b => {
        const active = b.dataset.view === safeMode;
        b.classList.toggle('active', active);
        b.setAttribute('aria-pressed', String(active));
      });

      try { localStorage.setItem('jyk-bhakti-view', safeMode); } catch(e) {}
    }

    controls.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
    let saved = 'both';
    try { saved = localStorage.getItem('jyk-bhakti-view') || 'both'; } catch(e) {}
    setView(saved);

  } catch (err) {
    title.textContent = 'Lyrics unavailable';
    subtitle.hidden = true;
    content.textContent = 'We could not load these lyrics. Please return to the Bhakti Sangeet library and try again.';
  }
})();
</script>
<script src="app.js"></script>
</body>
</html>
